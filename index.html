<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم أمنية الخاص ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rose: #ffc0cb; --gold: #ffd700; --glass: rgba(0, 0, 0, 0.85); }
        body, html { margin: 0; padding: 0; width: 100%; min-height: 100vh; font-family: sans-serif; background: #000; color: white; overflow-x: hidden; }

        /* الخلفية المزدوجة */
        #site-bg { 
            position: fixed; inset: 0; width: 100%; height: 100%; 
            background-size: cover !important; background-position: center !important; 
            background-attachment: fixed !important; z-index: -10; 
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: -9; }

        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        #login-screen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10000; background: #000; }
        #main-content { display: none; padding: 60px 15px; text-align: center; }
        .ar-font { font-family: 'Amiri Quran', serif; color: var(--rose); }

        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 25px 0; }
        .photo-card { border-radius: 15px; overflow: hidden; height: 160px; border: 1px solid var(--rose); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }

        .music-btn { position: fixed; top: 20px; left: 20px; width: 50px; height: 50px; background: var(--rose); color: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 5000; cursor: pointer; }

        /* زرار التحكم الجديد المخفي */
        .admin-trigger { margin-top: 25px; font-size: 14px; color: rgba(255,255,255,0.3); cursor: pointer; display: block; text-decoration: none; }

        #admin { position: fixed; inset: 0; background: #000; display: none; padding: 20px; z-index: 20000; overflow-y: auto; }
        .m-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--rose); text-align: right; }
        .m-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-bottom: 5px; display: block; }
        
        input, textarea { width: 100%; padding: 12px; background: #000; color: white; border: 1px solid #444; border-radius: 10px; margin-top: 10px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 15px; background: var(--rose); border: none; font-weight: bold; border-radius: 10px; margin-top: 10px; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div id="site-bg"></div>
    <div class="overlay"></div>

    <div class="music-btn" onclick="toggleM()" id="mIcon"><i class="fas fa-heart"></i></div>

    <div id="login-screen">
        <div class="glass" style="width:300px; text-align:center;">
            <h2 class="ar-font">أمنية ✨</h2>
            <input type="password" id="pIn" placeholder="الباسورد">
            <button onclick="access()" class="btn-action">دخول</button>
            
            <span class="admin-trigger" onclick="openAdmin()">مبروك التخرج</span>
        </div>
    </div>

    <div id="main-content">
        <audio id="bg-music" loop></audio>
        <h1 id="h-title" class="ar-font" style="font-size: 2.5rem; color:var(--gold)"></h1>
        <div class="glass"><p id="h-intro"></p></div>
        <h3 class="ar-font" style="color:var(--rose)">أحلى اللحظات 📸</h3>
        <div class="gallery" id="g-list"></div>
        <h3 class="ar-font">رسائل لكِ ❤️</h3>
        <div id="n-list"></div>
    </div>

    <div id="admin">
        <div style="max-width: 500px; margin: auto;">
            <h2 style="text-align:center; color:var(--rose);">لوحة التحكم ⚙️</h2>
            
            <div class="glass">
                <label>الباسورد الحالي:</label>
                <input type="text" id="newPass" placeholder="تغيير الباسورد">
                <button class="btn-action" style="background:var(--gold)" onclick="savePass()">حفظ الباسورد</button>
            </div>

            <div class="glass">
                <label>الخلفية (رابط مباشر - أضمن):</label>
                <input type="text" id="bgLink" placeholder="حط لينك الصورة هنا">
                <button class="btn-action" onclick="saveBgLink()">تحديث باللينك</button>
                <hr style="margin:20px 0; opacity:0.1">
                <label>الخلفية (رفع من الجهاز):</label>
                <input type="file" accept="image/*" onchange="up(this, 'bgUpload')">
            </div>

            <div class="glass">
                <label>نصوص الموقع:</label>
                <input type="text" id="inT" placeholder="العنوان">
                <textarea id="inI" placeholder="التهنئة"></textarea>
                <input type="file" accept="audio/*" onchange="up(this, 'song')">
                <button class="btn-action" onclick="saveT()">حفظ النصوص</button>
            </div>

            <div class="glass">
                <label>إضافة صور ورسائل:</label>
                <input type="file" accept="image/*" onchange="up(this, 'gallery')">
                <textarea id="mText" placeholder="اكتب الرسالة..."></textarea>
                <button class="btn-action" onclick="addN()">إضافة</button>
            </div>

            <h4>إدارة المحتوى (الحذف):</h4>
            <div id="admin-items"></div>
            <button class="btn-action" style="background:#333; color:white;" onclick="closeAdmin()">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const fbc = {
            apiKey: "AIzaSyCxR76s_IdudpXrilKXLOsMyTtNrqPYTiI",
            authDomain: "omnia-97917.firebaseapp.com",
            projectId: "omnia-97917",
            databaseURL: "https://omnia-97917-default-rtdb.firebaseio.com",
            appId: "1:448875167140:web:c89fc5d74b88e31dbf9531"
        };

        const app = initializeApp(fbc);
        const db = getDatabase(app);
        let currentPass = "123";

        onValue(ref(db, 'omnia_v24_final'), (s) => {
            const data = s.val() || {};
            currentPass = data.pass || "123";
            document.getElementById('h-title').innerText = data.title || "مبروك التخرج";
            document.getElementById('h-intro').innerText = data.intro || "أمنية";
            
            if(data.bg) document.getElementById('site-bg').style.backgroundImage = `url('${data.bg}')`;
            if(data.song) document.getElementById('bg-music').src = data.song;

            const nBox = document.getElementById('n-list'), gBox = document.getElementById('g-list'), aItems = document.getElementById('admin-items');
            nBox.innerHTML = gBox.innerHTML = aItems.innerHTML = "";

            if(data.notes) Object.keys(data.notes).forEach(k => {
                nBox.innerHTML += `<div class="glass">${data.notes[k]}</div>`;
                aItems.innerHTML += `<div class="m-item"><b>الرسالة:</b> <p>${data.notes[k]}</p><button onclick="del('notes/${k}')" style="color:red; background:none; border:1px solid red; padding:5px; border-radius:5px;">حذف</button></div>`;
            });

            if(data.media) Object.keys(data.media).forEach(k => {
                gBox.innerHTML += `<div class="photo-card"><img src="${data.media[k].data}"></div>`;
                aItems.innerHTML += `<div class="m-item"><img src="${data.media[k].data}"><button onclick="del('media/${k}')" style="color:red; float:left;">حذف</button></div>`;
            });
        });

        window.openAdmin = () => { document.getElementById('admin').style.display = 'block'; };
        window.closeAdmin = () => { document.getElementById('admin').style.display = 'none'; };

        window.saveBgLink = () => {
            const link = document.getElementById('bgLink').value;
            if(link) { set(ref(db, 'omnia_v24_final/bg'), link); alert("تم تثبيت رابط الخلفية! ✅"); }
        };

        window.up = (i, t) => {
            const r = new FileReader();
            r.onload = (e) => {
                if(t === 'bgUpload') set(ref(db, 'omnia_v24_final/bg'), e.target.result);
                else if(t === 'song') set(ref(db, 'omnia_v24_final/song'), e.target.result);
                else push(ref(db, 'omnia_v24_final/media'), { data: e.target.result });
                alert("تم الحفظ! ✅");
            };
            r.readAsDataURL(i.files[0]);
        };

        window.savePass = () => { set(ref(db, 'omnia_v24_final/pass'), document.getElementById('newPass').value); alert("تم تغيير الباسورد! 🔐"); };
        window.del = (p) => { if(confirm("حذف نهائي؟")) remove(ref(db, `omnia_v24_final/${p}`)); };
        window.addN = () => { push(ref(db, 'omnia_v24_final/notes'), document.getElementById('mText').value); document.getElementById('mText').value=""; };
        window.saveT = () => { set(ref(db, 'omnia_v24_final/title'), document.getElementById('inT').value); set(ref(db, 'omnia_v24_final/intro'), document.getElementById('inI').value); };
        
        window.toggleM = () => {
            const a = document.getElementById('bg-music');
            if(a.paused) { a.play(); document.getElementById('mIcon').innerHTML = '<i class="fas fa-heart"></i>'; }
            else { a.pause(); document.getElementById('mIcon').innerHTML = '<i class="fas fa-heart-broken"></i>'; }
        };

        window.access = () => {
            if(document.getElementById('pIn').value === currentPass) {
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                document.getElementById('bg-music').play();
            } else alert("الباسورد غلط!");
        };
    </script>
</body>
</html>
