<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="siteTitle">عالم أمنية الخاص ✨</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700&display=swap');
        :root { --gold: #ffb703; --glass: rgba(0, 0, 0, 0.3); } 
        
        body { margin: 0; background-color: #000; background-size: cover; background-position: center; background-attachment: fixed; font-family: 'Cairo', sans-serif; color: #fff; text-align: center; overflow-x: hidden; }
        /* طبقة حماية للرؤية مع الحفاظ على الشفافية */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(1px); z-index: -1; }

        #gate { height: 100vh; display: flex; justify-content: center; align-items: center; position: fixed; width: 100%; z-index: 9999; background-size: cover; background-position: center; transition: 1s; }
        #gate-overlay { background: var(--glass); padding: 30px; border-radius: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); width: 85%; max-width: 380px; }
        
        #content { display: none; opacity: 0; padding: 20px; transition: 1s; }
        .grad-header { font-family: 'Amiri', serif; font-size: 2.8rem; text-shadow: 0 0 15px var(--gold); margin: 60px auto 20px; color: var(--gold); }

        /* الكروت الشفافة تماماً */
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); max-width: 800px; margin: 15px auto; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        .live-counter { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; direction: ltr; }
        .counter-unit { background: rgba(255, 183, 3, 0.1); padding: 10px; border-radius: 12px; min-width: 50px; border: 1px solid rgba(255, 183, 3, 0.3); }
        .unit-num { display: block; font-size: 1.2rem; font-weight: bold; color: var(--gold); }
        .unit-label { font-size: 0.6rem; color: #ddd; }

        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px auto; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }

        .music-btn { position: fixed; top: 20px; left: 20px; width: 45px; height: 45px; background: var(--gold); color: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 5000; cursor: pointer; }

        .adm-btn { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); color: #fff; padding: 25px; border-radius: 20px; z-index: 10001; width: 90%; max-width: 400px; text-align: right; max-height: 85vh; overflow-y: auto; border: 1px solid var(--gold); }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }
        .trigger { opacity: 0.2; font-size: 12px; margin-top: 20px; cursor: pointer; display: block; }
    </style>
</head>
<body>

    <div id="gate">
        <div id="gate-overlay">
            <h1 id="gateName" style="color:var(--gold); font-family:'Amiri';">أمنية ✨</h1>
            <input type="password" id="gatePass" placeholder="كلمة السر" style="text-align: center;">
            <button onclick="unlock()" class="adm-btn">دخول</button>
            <span class="trigger" onclick="openAdmin()">مبروك التخرج</span>
        </div>
    </div>

    <div class="music-btn" onclick="toggleM()" id="mBtn"><i class="fas fa-music"></i></div>

    <div id="content">
        <audio id="bgMusic" loop></audio>
        <div class="grad-header" id="welcome-text">ألف مبروك النجاح</div>
        
        <div class="glass-card">
            <h5 style="margin:0 0 10px; color:var(--gold);">بدايه الرحلة:</h5>
            <div id="live-timer" class="live-counter"></div>
            <div id="messages-list"></div>
        </div>

        <h3 style="color:var(--gold)">ذكرياتنا 📸</h3>
        <div class="gallery" id="photo-gallery"></div>
    </div>

    <div id="admin-panel">
        <h3 style="text-align:center; color:var(--gold);">لوحة التحكم ⚙️</h3>
        
        <div class="glass-card" style="background:rgba(255,255,255,0.05)">
            <label>1. إعدادات الدخول:</label>
            <input type="text" id="confPass" placeholder="باسورد الدخول">
            <input type="date" id="confDate">
            <button onclick="saveSettings()" class="adm-btn">حفظ الأساسيات</button>
        </div>

        <div class="glass-card" style="background:rgba(255,255,255,0.05)">
            <label>2. التحكم في الخلفية (الأوبشن اللي ناقص):</label>
            <input type="text" id="bgLink" placeholder="ضع رابط صورة مباشر (URL)">
            <input type="file" id="bgFile" accept="image/*">
            <button onclick="updateBg()" class="adm-btn" style="background:#28a745; color:white;">تحديث الخلفية فقط</button>
        </div>

        <div class="glass-card" style="background:rgba(255,255,255,0.05)">
            <label>3. المحتوى والموسيقى:</label>
            <input type="file" id="musicFile" accept="audio/*">
            <input type="file" id="photoFile" accept="image/*">
            <textarea id="msgInp" placeholder="اكتب رسالة جديدة"></textarea>
            <button onclick="uploadContent()" id="upBtn" class="adm-btn">رفع المحتوى</button>
        </div>

        <button onclick="document.getElementById('admin-panel').style.display='none'" class="adm-btn" style="background:#444; color:#fff;">إغلاق</button>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCxR76s_IdudpXrilKXLOsMyTtNrqPYTiI",
            authDomain: "omnia-97917.firebaseapp.com",
            projectId: "omnia-97917",
            databaseURL: "https://omnia-97917-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let settings = { date: "2026-01-01", pass: "123" };

        // مزامنة البيانات
        db.ref('appSettings').on('value', s => { if(s.val()) { settings = s.val(); document.getElementById('confPass').value = settings.pass; document.getElementById('confDate').value = settings.date; } });
        db.ref('visuals/bg').on('value', s => { if(s.val()) { document.body.style.backgroundImage = `url(${s.val()})`; document.getElementById('gate').style.backgroundImage = `url(${s.val()})`; } });
        db.ref('visuals/music').on('value', s => { if(s.val()) document.getElementById('bgMusic').src = s.val(); });

        function unlock() {
            if(document.getElementById('gatePass').value === settings.pass) {
                document.getElementById('gate').style.display = "none";
                document.getElementById('content').style.display = "block";
                document.getElementById('content').style.opacity = "1";
                document.getElementById('bgMusic').play();
                startLiveCounter(); loadData();
            } else alert("الباسورد غلط!");
        }

        function openAdmin() { if(prompt("باسورد الإدارة:") === "1997") document.getElementById('admin-panel').style.display = "block"; }

        function toggleM() {
            const m = document.getElementById('bgMusic');
            if(m.paused) { m.play(); document.getElementById('mBtn').innerHTML = '<i class="fas fa-pause"></i>'; }
            else { m.pause(); document.getElementById('mBtn').innerHTML = '<i class="fas fa-music"></i>'; }
        }

        async function saveSettings() {
            await db.ref('appSettings').set({ pass: document.getElementById('confPass').value, date: document.getElementById('confDate').value });
            alert("تم حفظ الأساسيات ✅");
        }

        async function updateBg() {
            const link = document.getElementById('bgLink').value;
            const file = document.getElementById('bgFile').files[0];
            if(link) await db.ref('visuals/bg').set(link);
            if(file) {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = async () => { await db.ref('visuals/bg').set(r.result); alert("الخلفية اتحدثت ✅"); };
            } else if(link) alert("الخلفية اتحدثت ✅");
        }

        async function uploadContent() {
            const btn = document.getElementById('upBtn'); btn.disabled = true;
            const music = document.getElementById('musicFile').files[0];
            const photo = document.getElementById('photoFile').files[0];
            const msg = document.getElementById('msgInp').value;

            if(msg) await db.ref('messages').push({text: msg});
            if(music) {
                const r = new FileReader(); r.readAsDataURL(music);
                r.onload = async () => { await db.ref('visuals/music').set(r.result); };
            }
            if(photo) {
                const r = new FileReader(); r.readAsDataURL(photo);
                r.onload = async () => { await db.ref('photos').push({url: r.result}); finish(); };
            } else finish();
        }

        function finish() { alert("تم الرفع ✅"); location.reload(); }

        function loadData() {
            db.ref('messages').on('value', s => {
                const l = document.getElementById('messages-list'); l.innerHTML = "";
                if(s.val()) Object.values(s.val()).reverse().forEach(m => {
                    l.innerHTML += `<div style="background:rgba(255,215,0,0.05); padding:10px; border-radius:10px; margin:5px 0; border-right:3px solid var(--gold); text-align:right;">${m.text}</div>`;
                });
            });
            db.ref('photos').on('value', s => {
                const g = document.getElementById('photo-gallery'); g.innerHTML = "";
                if(s.val()) Object.values(s.val()).forEach(p => { g.innerHTML += `<img src="${p.url}">`; });
            });
        }

        function startLiveCounter() {
            setInterval(() => {
                const startDate = new Date(settings.date + " 00:00:00");
                const now = new Date();
                let diff = now - startDate;
                let years = now.getFullYear() - startDate.getFullYear();
                let months = now.getMonth() - startDate.getMonth();
                let days = now.getDate() - startDate.getDate();
                if (days < 0) { months--; let lastMonth = new Date(now.getFullYear(), now.getMonth(), 0); days += lastMonth.getDate(); }
                if (months < 0) { years--; months += 12; }
                const hrs = Math.floor((diff / (1000 * 60 * 60)) % 24), mins = Math.floor((diff / (1000 * 60)) % 60), secs = Math.floor((diff / 1000) % 60);
                document.getElementById('live-timer').innerHTML = `
                    <div class="counter-unit"><span class="unit-num">${years}</span><span class="unit-label">سنة</span></div>
                    <div class="counter-unit"><span class="unit-num">${months}</span><span class="unit-label">شهر</span></div>
                    <div class="counter-unit"><span class="unit-num">${days}</span><span class="unit-label">يوم</span></div>
                    <div class="counter-unit"><span class="unit-num">${hrs}</span><span class="unit-label">ساعة</span></div>
                    <div class="counter-unit"><span class="unit-num">${mins}</span><span class="unit-label">دقيقة</span></div>
                    <div class="counter-unit"><span class="unit-num">${secs}</span><span class="unit-label">ثانية</span></div>`;
            }, 1000);
        }
    </script>
</body>
</html>
